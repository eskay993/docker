  peacockserver:
    container_name: peacock
    build: https://github.com/eskay993/peacockserver-docker.git
    ports:
      - "3000:80"
    volumes:
      - ${APPDATA}/peacock/userdata:/Peacock/userdata
      - ${APPDATA}/peacock/contractSessions:/Peacock/contractSessions
      - ${APPDATA}/peacock/plugins:/Peacock/plugins


  gameyfin:
    image: ghcr.io/gameyfin/gameyfin:2
    container_name: gameyfin
    restart: unless-stopped
    env_file:
      - ${ENV_FILES}/gameyfin.env
    volumes:
      - ${APPDATA}/gameyfin/db:/opt/gameyfin/db
      - ${APPDATA}/gameyfin/data:/opt/gameyfin/data
      - ${APPDATA}/gameyfin/plugindata:/opt/gameyfin/plugindata
      - ${APPDATA}/gameyfin/logs:/opt/gameyfin/logs
      - ${STORAGE}/Games:/games
    ports:
      - "8008:8080"
      # If you plan to use the included torrent plugin, uncomment the following lines:
